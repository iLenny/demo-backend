name: CI Pipeline
on:
  push:
    branches: [ main, develop, 'release/**', 'feature/**' ]
  pull_request:
    branches: [ main, develop, 'release/**' ]

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: 305656143500
  ECR_REPOSITORY: lennycodes/demo-backend
  IMAGE_TAG: ${{ github.sha }}

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run tests
        run: |
          chmod +x mvnw
          ./mvnw clean verify -B --no-transfer-progress
      - name: Show low coverage classes
        if: always()
        run: |
          python3 << 'EOF'
          import xml.etree.ElementTree as ET
      
          tree = ET.parse('target/site/jacoco/jacoco.xml')
          root = tree.getroot()
      
          threshold = 80.0
      
          print("\nClasses below 80% line coverage:\n")
      
          found = False
      
          for package in root.findall('package'):
              for clazz in package.findall('class'):
                  name = clazz.attrib['name']
      
                  for counter in clazz.findall('counter'):
                      if counter.attrib['type'] == 'LINE':
                          missed = int(counter.attrib['missed'])
                          covered = int(counter.attrib['covered'])
      
                          total = missed + covered
      
                          if total == 0:
                              continue
      
                          pct = covered * 100.0 / total
      
                          if pct < threshold:
                              found = True
                              print(f"{pct:6.2f}%  {name}")
      
          if not found:
              print("All classes meet coverage threshold.")
          EOF

  push-image:
    runs-on: ubuntu-latest
    needs: unit-tests
    timeout-minutes: 20
    if: github.event_name == 'push' && !startsWith(github.ref, 'refs/heads/feature/')

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        run: |
          mkdir -p ~/.aws

          cat > ~/.aws/credentials <<EOF
          [default]
          aws_access_key_id=${{ secrets.AWS_ACCESS_KEY }}
          aws_secret_access_key=${{ secrets.AWS_SECRET_ACCESS_KEY }}
          EOF

          cat > ~/.aws/config <<EOF
          [default]
          region=${AWS_REGION}
          output=json
          EOF

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Login to ECR
        run: |
          aws ecr get-login-password --region $AWS_REGION > password.txt

          docker login \
            --username AWS \
            --password-stdin \
            $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com \
            < password.txt

          rm password.txt

      - name: Build Docker image
        run: |
          docker build \
            -t $ECR_REPOSITORY:$IMAGE_TAG \
            -t $ECR_REPOSITORY:latest \
            .

      - name: Tag Docker image
        run: |
          docker tag $ECR_REPOSITORY:$IMAGE_TAG \
            $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY:$IMAGE_TAG

          docker tag $ECR_REPOSITORY:latest \
            $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY:latest

      - name: Push image
        run: |
          docker push $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY:latest
  deploy-dev:
    runs-on: ubuntu-latest
    needs: push-image
    timeout-minutes: 20

    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'

    environment:
      name: dev

    env:
      ECS_CLUSTER: demo-dev-cluster
      ECS_SERVICE: demo-backend-dev-service
      ECS_TASK_DEFINITION: demo-backend-dev-task
      CONTAINER_NAME: demo-backend

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        run: |
          mkdir -p ~/.aws

          cat > ~/.aws/credentials <<EOF
          [default]
          aws_access_key_id=${{ secrets.AWS_ACCESS_KEY }}
          aws_secret_access_key=${{ secrets.AWS_SECRET_ACCESS_KEY }}
          EOF

          cat > ~/.aws/config <<EOF
          [default]
          region=${AWS_REGION}
          output=json
          EOF

      - name: Download current ECS task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition $ECS_TASK_DEFINITION \
            --query taskDefinition \
            > task-definition.json

      - name: Update task definition image
        run: |
          IMAGE_URI=$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY:$IMAGE_TAG

          python3 << EOF
          import json

          image_uri = "$IMAGE_URI"
          container_name = "$CONTAINER_NAME"

          with open("task-definition.json") as f:
              task_def = json.load(f)

          for field in [
              "taskDefinitionArn",
              "revision",
              "status",
              "requiresAttributes",
              "compatibilities",
              "registeredAt",
              "registeredBy"
          ]:
              task_def.pop(field, None)

          for container in task_def["containerDefinitions"]:
              if container["name"] == container_name:
                  container["image"] = image_uri

          with open("new-task-definition.json", "w") as f:
              json.dump(task_def, f, indent=2)
          EOF

      - name: Register new ECS task definition
        run: |
          NEW_TASK_DEF_ARN=$(aws ecs register-task-definition \
            --cli-input-json file://new-task-definition.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)

          echo "NEW_TASK_DEF_ARN=$NEW_TASK_DEF_ARN" >> $GITHUB_ENV

      - name: Deploy to ECS dev
        run: |
          aws ecs update-service \
            --cluster $ECS_CLUSTER \
            --service $ECS_SERVICE \
            --task-definition $NEW_TASK_DEF_ARN

      - name: Wait for ECS service stability
        run: |
          aws ecs wait services-stable \
            --cluster $ECS_CLUSTER \
            --services $ECS_SERVICE
          echo "Deployment to ECS dev completed successfully"